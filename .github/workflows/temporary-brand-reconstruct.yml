name: Temporary Brand Reconstruction

on:
  push:
    branches:
      - branding/jkdd-tech-logo-en-v2-2026-09-09
    paths:
      - .github/workflows/temporary-brand-reconstruct.yml

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: branding/jkdd-tech-logo-en-v2-2026-09-09
          fetch-depth: 0

      - name: Reconstruct and hard-verify corporate brand asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jkdd-brand assets/brand
          cat tools/brand_transfer/part01.b64 \
              tools/brand_transfer/part02.b64 \
              tools/brand_transfer/part03.b64 \
              tools/brand_transfer/part04.b64 \
              tools/brand_transfer/part05.b64 \
              tools/brand_transfer/part06.b64 \
            | tr -d '\r\n' > /tmp/jkdd-brand/logo.b64
          base64 --decode /tmp/jkdd-brand/logo.b64 > /tmp/jkdd-brand/logo.png

          size="$(stat -c%s /tmp/jkdd-brand/logo.png)"
          hash="$(sha256sum /tmp/jkdd-brand/logo.png | awk '{print $1}')"
          test "$size" = "19763"
          test "$hash" = "96bf85c39582e19719b6055b6ffb1a931da72c60f7e17e48a33265d22e611e57"

          python3 - <<'PY'
          from pathlib import Path
          import struct
          b = Path('/tmp/jkdd-brand/logo.png').read_bytes()
          assert b[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', b[16:24]) == (192, 192)
          PY

          cp /tmp/jkdd-brand/logo.png assets/brand/jkdd_tech_logo_official_en.png

      - name: Remove temporary transfer material
        shell: bash
        run: |
          rm -f tools/brand_transfer/part01.b64 tools/brand_transfer/part02.b64 \
                tools/brand_transfer/part03.b64 tools/brand_transfer/part04.b64 \
                tools/brand_transfer/part05.b64 tools/brand_transfer/part06.b64
          rmdir tools/brand_transfer 2>/dev/null || true
          rm -f .github/workflows/temporary-brand-reconstruct.yml

      - name: Commit verified binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(branding): install verified JKDD TECH EN v2 site logo"
          git push origin HEAD:branding/jkdd-tech-logo-en-v2-2026-09-09
