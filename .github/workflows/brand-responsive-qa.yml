name: Brand Responsive QA

on:
  push:
    branches:
      - branding/jkdd-tech-logo-en-v2-2026-09-09
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright library
        run: |
          npm install --no-save playwright@1.55.0
          google-chrome --version

      - name: Start static server
        run: |
          python3 -m http.server 4173 > /tmp/jkdd-tech-site.log 2>&1 &
          echo $! > /tmp/jkdd-tech-site.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/jkdd-tech-site.log
          exit 1

      - name: Run responsive branding QA
        run: |
          mkdir -p output/playwright
          cat > brand-qa.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const targets = [
            {name:'mobile-390x844', width:390, height:844},
            {name:'tablet-768x1024', width:768, height:1024},
            {name:'desktop-1440x1000', width:1440, height:1000},
          ];
          const browser = await chromium.launch({headless:true, executablePath:'/usr/bin/google-chrome'});
          const summary = [];
          for (const target of targets) {
            const page = await browser.newPage({ viewport: { width: target.width, height: target.height } });
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()); });
            await page.goto('http://127.0.0.1:4173/', { waitUntil:'networkidle' });
            await page.waitForSelector('.site-header .jkdd-tech-brand-img');
            const result = await page.evaluate(() => {
              const header = document.querySelector('.site-header .jkdd-tech-brand-img');
              const footer = document.querySelector('.site-footer .jkdd-tech-brand-img');
              const tagline = document.querySelector('[data-i18n="footer.tagline"]');
              const h = header?.getBoundingClientRect();
              const f = footer?.getBoundingClientRect();
              return {
                headerExists: !!header,
                footerExists: !!footer,
                headerLoaded: !!header && header.complete && header.naturalWidth > 0,
                footerLoaded: !!footer && footer.complete && footer.naturalWidth > 0,
                headerBox: h ? {width:h.width,height:h.height} : null,
                footerBox: f ? {width:f.width,height:f.height} : null,
                tagline: tagline?.textContent?.trim() ?? '',
                overflowX: document.documentElement.scrollWidth > window.innerWidth + 1,
                documentWidth: document.documentElement.scrollWidth,
                viewportWidth: window.innerWidth,
                headerSrc: header?.getAttribute('src') ?? '',
                footerSrc: footer?.getAttribute('src') ?? '',
              };
            });
            if (!result.headerExists || !result.footerExists) throw new Error(`${target.name}: missing header/footer brand image`);
            if (!result.headerLoaded || !result.footerLoaded) throw new Error(`${target.name}: brand image failed to load`);
            if (result.headerSrc !== 'assets/brand/jkdd_tech_logo_official_en.png' || result.footerSrc !== 'assets/brand/jkdd_tech_logo_official_en.png') throw new Error(`${target.name}: non-canonical brand path`);
            if (result.tagline !== 'Technology for a Better Tomorrow') throw new Error(`${target.name}: incorrect footer tagline: ${result.tagline}`);
            if (result.overflowX) throw new Error(`${target.name}: horizontal overflow ${result.documentWidth} > ${result.viewportWidth}`);
            if (errors.length) throw new Error(`${target.name}: browser errors: ${errors.join(' | ')}`);
            await page.screenshot({ path:`output/playwright/jkdd-tech-brand-${target.name}.png`, fullPage:true });
            summary.push({target, ...result});
            await page.close();
          }
          await browser.close();
          fs.writeFileSync('output/playwright/brand-qa-summary.json', JSON.stringify(summary, null, 2));
          NODE
          node brand-qa.mjs
          rm brand-qa.mjs

      - name: Upload branding QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: jkdd-tech-brand-responsive-qa
          path: output/playwright/
          if-no-files-found: error
