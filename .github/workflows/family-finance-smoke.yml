name: Family Finance Runtime Smoke

on:
  push:
    branches: [main]
    paths:
      - "apps/family-finance/**"
      - ".github/workflows/family-finance-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for GitHub Pages publication
        shell: bash
        run: |
          set -euo pipefail
          URL="https://jkddtech.com/apps/family-finance/?sha=\${GITHUB_SHA}"
          for attempt in $(seq 1 24); do
            if curl -fsSL --max-time 15 "$URL" | grep -q "continuo-password-9"; then
              echo "Published Family Finance bootstrap is live."
              exit 0
            fi
            echo "Waiting for Pages deployment ($attempt/24)..."
            sleep 5
          done
          echo "Timed out waiting for published bootstrap."
          exit 1

      - name: Inspect Family Finance source headers
        shell: bash
        run: |
          set -e
          echo "=== flutter.js ==="
          curl -sSIL --max-time 20 https://joukinneto.github.io/jkdd-family-finance/flutter.js
          echo "=== main.dart.js ==="
          curl -sSIL --max-time 20 https://joukinneto.github.io/jkdd-family-finance/main.dart.js

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify Family Finance first-access password rule
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const errors = [];
            const failedRequests = [];

            page.on('pageerror', error => errors.push('pageerror: ' + String(error)));
            page.on('console', message => {
              if (message.type() === 'error') errors.push('console: ' + message.text());
            });
            page.on('requestfailed', request => {
              failedRequests.push(
                request.url() + ' :: ' + (request.failure()?.errorText || 'unknown')
              );
            });

            await page.goto(
              'https://jkddtech.com/apps/family-finance/?smoke=' + Date.now(),
              { waitUntil: 'domcontentloaded', timeout: 90000 }
            );

            await page.waitForFunction(
              () => window.__JFF_CONTINUO_PATCH?.patchedSource === true &&
                    window.__JFF_CONTINUO_PATCH?.passwordMinLength === 9,
              { timeout: 90000 }
            );

            await page.locator('#jff-boot')
              .waitFor({ state: 'hidden', timeout: 90000 });

            await page.waitForFunction(
              () => document.querySelector('flutter-view') !== null ||
                    document.querySelector('flt-glass-pane') !== null,
              { timeout: 30000 }
            );

            if (errors.length) {
              console.log('Browser console/page errors:', errors);
              throw new Error('Browser reported runtime errors.');
            }
            if (failedRequests.length) {
              console.log('Failed requests:', failedRequests);
              throw new Error('Family Finance had failed network requests.');
            }

            console.log(
              'Family Finance runtime smoke passed: patched 9-character rule loaded and Flutter app started.'
            );
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
